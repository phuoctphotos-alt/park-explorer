const QB=`What does biodiversity mean?|The variety of all living things|How big a park is|How many people visit|Biodiversity is all the different plants, animals, fungi and tiny life in a place.
Why are bees and butterflies important?|They pollinate flowers|They make soil|They scare pests|Pollinators move pollen so plants can make seeds and fruit.
What do decomposers like fungi and worms do?|Break down dead things into soil food|Hunt other animals|Make honey|They recycle nutrients so new plants can grow.
Which is a producer in a food chain?|A plant|A hawk|A fox|Plants make their own food from sunlight.
What is a habitat?|A home where a living thing finds food and shelter|A kind of food|A weather forecast|Every species needs a habitat to survive.
Why should we leave fallen logs in the woods?|They shelter insects, salamanders and fungi|They are ugly|They block paths|Dead wood is a home and food for lots of life.
What is an invasive species?|A non-native species that harms nature|Any rare animal|A bird that migrates|Invasive species spread fast and crowd out natives.
Why do monarch caterpillars need milkweed?|It is the only plant they eat|It hides them|It is warm|Without milkweed monarchs can't grow up.
What is a food web?|Many food chains linked together|A spider's web|A grocery list|Animals often eat many things so chains connect into webs.
What does a native plant do best?|Support local wildlife|Grow only indoors|Need lots of fertilizer|Local animals and insects evolved with native plants.
Why is a clean pond good for biodiversity?|Frogs, fish and insects need clean water|Ducks hate clean water|It has no plants|Pollution can kill sensitive pond life.
What happens if a species goes extinct?|It is gone forever and others can be affected|It comes back next year|Nothing ever changes|Extinction is permanent and breaks links in the web.
How can you help wildlife in the park?|Stay on trails and take only photos|Feed the animals snacks|Pick all the flowers|Leaving wildlife alone keeps animals wild and safe.
Why shouldn't we release pet turtles into ponds?|They can harm native turtles|Ponds are too cold|Turtles can't swim|Released pets can spread disease and compete with natives.
What is a pollinator?|An animal that moves pollen between flowers|A water cleaner|A tree trunk|Bees, butterflies, moths, birds and bats can all pollinate.
Why do trees matter for biodiversity?|They give food, shade and homes|They only make wood|They stop rain|One oak tree can support hundreds of insect species.
What do we call plants and animals that live in one place together?|An ecosystem|A flavor|A road|An ecosystem includes living things and their surroundings.
Why do birds eat insects?|Insects are a protein-rich food|They are bored|To clean the air|Many baby birds are fed only insects.
What does 'native' mean?|Naturally lives in that area|Brought from far away|Very small|Native species belong in the local ecosystem.
Which helps biodiversity most?|Many kinds of plants and animals|Only one kind of tree|Lots of pavement|A varied area is stronger against problems.

function pip(q){const P=LK.split(" ").map(t=>t.split(",").map(Number));let c=0;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>q[1])!=(yj>q[1])&&q[0]<(xj-xi)*(q[1]-yi)/(yj-yi)+xi)c=!c}return c}

function mkG(){const p=gp.pos;for(let k=0;k<15;k++){const a=Math.random()*6.283,r=18+Math.random()*27,lat=p.lat+Math.cos(a)*r/110540,lon=p.lon+Math.sin(a)*r/(111320*Math.cos(p.lat*Math.PI/180)),w=pip(proj({lat,lon})),zs=w?["water"]:["woods","meadow","edge"],pool=D.filter(d=>w?CZ[d.c].includes("water"):CZ[d.c].some(z=>zs.includes(z))&&d.c!="Water Life");if(!pool.length)continue;const un=pool.filter(d=>!S.found[d.id]),d=rnd(un.length&&Math.random()<.75?un:pool);return{t:Math.random()<.12?"g":"s",id:d.id,w,r:Math.random()<.1,lat,lon}}return{t:"g",id:0,w:0,lat:p.lat+1e-4,lon:p.lon}}
function startGps(){if(!navigator.geolocation)return alert("This device has no GPS.");gp.on=1;gp.id=navigator.geolocation.watchPosition(onPos,e=>{alert("Couldn't get your location. Please allow location access, or use the practice map.");stopGps()},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});mapDraw()}
function stopGps(){if(gp.id!=null)navigator.geolocation.clearWatch(gp.id);gp={on:0,id:null,pos:null,sp:[],last:null,h:"any"};mapDraw()}
function onPos(e){const p={lat:e.coords.latitude,lon:e.coords.longitude,acc:e.coords.accuracy};gp.pos=p;
if(!gp.last||dist(gp.last,p)>25||gp.sp.length<3){if(gp.sp.length<6){gp.sp.push(mkG());}gp.last=p}
gp.sp=gp.sp.filter(x=>dist(p,x)<150);
if(!$("#modal").innerHTML){const i=gp.sp.findIndex(x=>!x.ign&&dist(p,x)<=15);if(i>=0){gp.sp[i].ign=1;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}enc(i,gp.sp);return}}
if(tab=="p"&&!$("#modal").innerHTML)gpsDraw()}
function gpsDraw(){const p=gp.pos,m=$("#main");
if(!p){m.innerHTML=`<div class="pad" style="text-align:center"><div class="big">📡</div><h3>Finding your location...</h3><p>Please allow location access.</p><button class="btn g" id="st">Cancel</button></div>`;$("#st").onclick=stopGps;return}
if(gp.far===undefined){gp.far=dist(ANC,p)>2500;gp.ref=p}
const[px,py]=proj(p),W=200;
m.innerHTML=`<div class="mapw" id="gm" style="aspect-ratio:1"><svg viewBox="${px-W/2} ${py-W/2} ${W} ${W}" preserveAspectRatio="xMidYMid slice">${MAPS}</svg>${gp.sp.map((x,i)=>{const[sx,sy]=proj(x),l=50+(sx-px)/W*100,t=50+(sy-py)/W*100;if(l<3||l>97||t<3||t>97)return"";const d=Math.round(dist(p,x));return`<button class="sp ${x.r?"r":""}" data-i="${i}" style="left:${l}%;top:${t}%">${x.t=="g"?"🎁":x.w?"💧":"🌿"}<small style="display:block;font-size:10px;color:#222;text-shadow:0 0 3px #fff">${d}m</small></button>`}).join("")}<div class="me" style="left:50%;top:50%">${S.av}</div></div>
<div class="pad" style="text-align:center"><small style="color:var(--mu)">${gp.far?"🧪 Practice walk: you're not at the park, so the map starts you at the dock. ":""}📍 GPS ±${Math.round(p.acc)}m · Walk within 15m of a 🌿💧 to meet it. Stay on trails with a grown-up. Your location stays on this device.</small><br><button class="btn g" id="al">${gp.al?"👆 Tap where you really are":"🎯 My dot is in the wrong place"}</button><button class="btn g" id="st">⏹ Stop GPS</button></div>`;
$("#st").onclick=stopGps;$("#al").onclick=()=>{gp.al=!gp.al;gpsDraw()};
$("#gm").onclick=e=>{if(!gp.al||e.target.closest(".sp"))return;const r=$("#gm").getBoundingClientRect();gp.ox=(gp.ox||0)+(px-W/2+(e.clientX-r.left)/r.width*W)-px;gp.oy=(gp.oy||0)+(py-W/2+(e.clientY-r.top)/r.height*W)-py;gp.al=0;gpsDraw()};
m.querySelectorAll(".sp").forEach(b=>b.onclick=()=>{const x=gp.sp[+b.dataset.i];if(dist(p,x)>25)return alert("Walk closer along the trail! 🥾");x.ign=1;enc(+b.dataset.i,gp.sp)})}
let mp={sp:[],x:180,y:240,busy:0};
function mkSp(){const un=D.filter(d=>!S.found[d.id]),pool=un.length&&Math.random()<.75?un:D,d=rnd(pool),z=ZN[rnd(CZ[d.c])];
return{t:Math.random()<.12?"g":"s",id:d.id,x:z[0]+Math.random()*z[2],y:z[1]+Math.random()*z[3],r:Math.random()<.1}}
function fill(){while(mp.sp.length<9)mp.sp.push(mkSp())}
function mapDraw(){if(gp.on)return gpsDraw();fill();const w=document.createElement("div");
$("#main").innerHTML=`<div class="mapw"><svg viewBox="0 0 360 440"><rect width="360" height="440" fill="#7cb342"/><rect x="185" y="15" width="165" height="180" rx="20" fill="#c5e1a5"/>${[...Array(14)].map((_,i)=>`<circle cx="${200+(i*37)%140}" cy="${35+(i*53)%140}" r="3" fill="${i%2?"#f06292":"#fff176"}"/>`).join("")}${[[40,50],[90,40],[140,70],[60,110],[120,130],[40,170],[100,175],[150,150]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="26" fill="#2e7d32"/>`).join("")}<path d="M30 235 Q180 190 330 235 Q340 270 250 275 Q180 285 100 275 Q20 270 30 235Z" fill="none" stroke="#a1887f" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/><ellipse cx="180" cy="330" rx="110" ry="55" fill="#4fc3f7"/><path d="M180 385 Q200 410 170 440" stroke="#4fc3f7" stroke-width="10" fill="none"/><text x="180" y="334" text-anchor="middle" font-size="12" fill="#01579b">Lake</text><text x="30" y="14" font-size="10" fill="#fff">Woods</text><text x="270" y="14" font-size="10" fill="#33691e">Meadow</text></svg>${mp.sp.map((p,i)=>`<button class="sp ${p.r?"r":""}" data-i="${i}" style="left:${p.x/3.6}%;top:${p.y/4.4}%">${p.t=="g"?"🎁":ZN.water&&p.y>290&&p.x>95&&p.x<265?"💧":"🌿"}</button>`).join("")}<div class="me" style="left:${mp.x/3.6}%;top:${mp.y/4.4}%">${S.av}</div></div><div class="pad" style="text-align:center"><small style="color:var(--mu)">Tap rustling grass 🌿, ripples 💧 and gifts 🎁. Answer correctly to catch! ✨ Glowing = rare (big bonus)</small><br><button class="btn g" id="rf">🔄 Find new spots</button><button class="btn" id="gps">📍 Use my real location</button></div>`;
document.querySelectorAll(".sp").forEach(b=>b.onclick=()=>{if(mp.busy)return;mp.busy=1;const p=mp.sp[+b.dataset.i];mp.x=p.x;mp.y=p.y;document.querySelector(".me").style.left=p.x/3.6+"%";document.querySelector(".me").style.top=p.y/4.4+"%";setTimeout(()=>{mp.busy=0;enc(+b.dataset.i)},650)});
$("#gps").onclick=startGps;$("#rf").onclick=()=>{mp.sp=[];mapDraw()}}
function enc(i,A=mp.sp){const p=A[i],d=D[p.id],g=p.t=="g",useQ=g||Math.random()<.3,qq=useQ?rnd(QB):{q:"Ranger clue: "+d.f+" Who is it?",a:d.n,o:[d.n,...D.filter(x=>x.c==d.c&&x.id!=d.id).sort(()=>Math.random()-.5).slice(0,2).map(x=>x.n)],e:d.f},o=[...qq.o].sort(()=>Math.random()-.5);
sheet(`<div class="pp ${useQ&&!g?"":"sil"}">${g?"🎁":d.e}</div><h3>${g?"A mystery gift!":p.r?"✨ A RARE creature appeared!":"A wild creature appeared!"}</h3>${useQ&&!g?`<p style="color:var(--mu)">It's a ${d.c.replace(/s$/,"")}! Answer to catch it.</p>`:""}<p><b>${qq.q}</b></p>${o.map(t=>`<button class="q" data-a="${t.replace(/"/g,"&quot;")}">${t}</button>`).join("")}<button class="btn g" id="x">Run away</button>`);
$("#x").onclick=()=>{close()};document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{const ok=b.dataset.a==qq.a;A.splice(i,1);let g2=0,msg="";
if(ok){if(g){if(Math.random()<.5||S.owned.length>=SH.length){g2=30;msg="🎁 You opened the gift: +30 bonus points!"}else{const L=SH.map((s,k)=>k).filter(k=>!S.owned.includes(k)),k=rnd(L);S.owned.push(k);msg=`🎁 Surprise prize: free ${SH[k][0]} ${SH[k][1]}!`;g2=10}}else{const nw=!S.found[d.id];g2=(nw?10:3)+(p.r?25:0)+(useQ?0:5);if(nw)S.found[d.id]={};msg=nw?`🎉 New in your Field Guide: ${d.e} <b>${d.n}</b>!`:`You already had ${d.n}. +bonus for practice!`}}
const old=lvl();S.pts+=g2;S.tot+=g2;if(ok)S.qa=(S.qa||0)+1;save();
sheet(`<div class="big">${ok?(g?"🎁":d.e):"💨"}</div><h2>${ok?"Caught! 🎯":"It got away!"}</h2><p>${ok?msg:"The answer was: "+qq.a}</p><p>${ok&&!g?"<b>"+d.n+":</b> "+d.f:qq.e||""}</p>${ok?`<h3>+${g2} ⭐</h3>`:""}${lvl()>old?`<h2>🎉 Level up! ${LV[lvl()]}</h2>`:""}<button class="btn" id="x">Keep exploring</button>`);$("#x").onclick=close})}
const LV=["Seedling","Sprout","Tracker","Ranger","Naturalist","Park Hero","Biodiversity Master"],
SH=[["🎩","Explorer Hat",30],["🔭","Binoculars",50],["🧢","Ranger Cap",80],["🦸","Hero Cape",120],["👑","Golden Crown",250],["🌈","Rainbow Badge",150],["🐉","Dragon Buddy",300],["⭐","Star Medal",100]],
CATS=["All",...new Set(D.map(d=>d.c))];
let S={pts:0,tot:0,found:{},owned:[],av:"🧒"},tab="p",cat="All";
try{S={...S,...JSON.parse(localStorage.getItem("pe")||"{}")}}catch(e){}
const save=()=>{try{localStorage.setItem("pe",JSON.stringify(S))}catch(e){}},$=s=>document.querySelector(s),
lvl=()=>Math.min(Math.floor(S.tot/100),LV.length-1);
function head(){$("#av").textContent=S.av+" Park Explorer";$("#pts").textContent="⭐ "+S.pts;$("#lv").textContent="Level "+(lvl()+1)+": "+LV[lvl()];
$("#cnt").textContent=Object.keys(S.found).length+"/"+D.length+" found";$("#xp").style.width=(S.tot%100)+"%"}
function draw(){head();const m=$("#main");if(tab=="p")return mapDraw();if(tab=="q")return qHome();
if(tab=="g"){m.innerHTML=`<div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("")}</div><div class="grid">${D.filter(d=>cat=="All"||d.c==cat).map(d=>{const f=S.found[d.id];return`<button class="c ${f?"f":""}" data-i="${d.id}"><span>${f?d.e:"❓"}</span>${f?d.n+" ✅":"???"}<br><small>${d.c}</small></button>`}).join("")}</div>`;
m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});m.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>open(+b.dataset.i))}
if(tab=="s")m.innerHTML=`<div class="pad"><h3>Spend your points!</h3>${SH.map((s,i)=>{const o=S.owned.includes(i);return`<div class="shop"><span>${s[0]} ${s[1]}</span>${o?`<button class="btn" data-e="${i}">${S.av==s[0]?"Wearing":"Wear"}</button>`:`<button class="btn" data-b="${i}">⭐ ${s[2]}</button>`}</div>`}).join("")}</div>`;
if(tab=="m"){const n=Object.keys(S.found).length,by=CATS.slice(1).map(c=>{const t=D.filter(d=>d.c==c),f=t.filter(d=>S.found[d.id]).length;return`<div class="shop"><span>${c}</span><b>${f}/${t.length}</b></div>`}).join("");
m.innerHTML=`<div class="pad"><div style="text-align:center"><div class="big">${S.av}</div><h2>${LV[lvl()]}</h2><p>${S.tot} total points · ${n} species found</p></div>${by}<div style="text-align:center"><button class="btn g" id="rs">Reset game</button></div></div>`;
$("#rs").onclick=()=>{if(confirm("Erase all progress?")){S={pts:0,tot:0,found:{},owned:[],av:"🧒"};save();draw()}}}
m.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const s=SH[+b.dataset.b];if(S.pts<s[2])return alert("Find more things to earn points!");S.pts-=s[2];S.owned.push(+b.dataset.b);S.av=s[0];save();draw()});
m.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{S.av=SH[+b.dataset.e][0];save();draw()})}
const sheet=h=>{$("#modal").innerHTML=`<div class="modal"><div class="sheet">${h}</div></div>`},close=()=>{$("#modal").innerHTML="";draw()};
function open(i){const d=D[i],f=S.found[i];
sheet(`<div class="big">${f?d.e:"❓"}</div><h2>${f?d.n:"Mystery "+d.c.replace(/s$/,"")}</h2><p>${f?d.f:"Clue: "+d.f.replace(new RegExp(d.n.split(" ")[0],"gi"),"___")}</p><p style="color:var(--mu)">${f?"You found this one! 🎉":"Find it in the park and snap a photo to earn ⭐10!"}</p>
${f&&f.img?`<img class="p" src="${f.img}">`:""}${f?"":`<label class="btn">📸 I found it!<input id="ph" type="file" accept="image/*" capture="environment" hidden></label>`}<button class="btn g" id="x">Close</button>`);
$("#x").onclick=close;const ph=$("#ph");if(ph)ph.onchange=e=>thumb(e.target.files[0],i)}
function thumb(file,i){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);quiz(i,c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(file)}
function quiz(i,img){const d=D[i],o=[d,...D.filter(x=>x.c==d.c&&x.id!=i).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
sheet(`<img class="p" src="${img}"><h3>Great photo! 🧠 Quick quiz for bonus ⭐5</h3><p>"${d.f}"</p><p>Which one is this?</p>${o.map(x=>`<button class="q" data-k="${x.id}">${x.n}</button>`).join("")}`);
document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{done(i,img,+b.dataset.k==i)})}
function done(i,img,ok){const d=D[i],old=lvl();let g=10+(ok?5:0),sur="";
if(Math.random()<.25){const r=Math.random();if(r<.6){const b=[20,30,50][Math.floor(Math.random()*3)];g+=b;sur=`🎁 Surprise! Mystery box gave you +${b} bonus points!`}else{const L=SH.map((s,k)=>k).filter(k=>!S.owned.includes(k));if(L.length){const k=L[Math.floor(Math.random()*L.length)];S.owned.push(k);sur=`🎁 Surprise prize! You won a free ${SH[k][0]} ${SH[k][1]}!`}else{g+=40;sur="🎁 Surprise! +40 bonus points!"}}}
S.found[i]={img};S.pts+=g;S.tot+=g;save();const up=lvl()>old;
sheet(`<div class="big">${d.e}</div><h2>${d.n}</h2><p>${ok?"✅ Correct! ":"Good try! "}<b>${d.f}</b></p><h3>+${g} ⭐ points!</h3>${sur?`<p style="font-size:18px">${sur}</p>`:""}${up?`<h2>🎉 Level up! You're a ${LV[lvl()]}!</h2>`:""}<button class="btn" id="x">Keep exploring</button>`);$("#x").onclick=close}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));draw()});
draw();
</script></body></html>
